name: OnDemand Sanitizers Bots
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
  schedule:
    - cron: '0 16 * * *'
env:
  CACHE_EPOCH: 146-2
  GOPROXY: direct
jobs:
  sanitizer-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        build_type: [Debug, Release]
        sanitizer:
          - name: address
            cmake_options: -DASAN=on -DUSE_LIBCXX=on
          - name: undefined behavior
            cmake_options: -DUBSAN=on -DUSE_LIBCXX=off
          - name: thread
            cmake_options: -DTSAN=on -DUSE_LIBCXX=on
          - name: memory
            cmake_options: -DMSAN=on -DUSE_LIBCXX=on -DUSE_CURL=off
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Checkout with shallow submodules
        run: |
          # unshallow must come first otherwise submodule may be get unshallowed
          git fetch --tags --unshallow
          git submodule update --init --depth 1
      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: |
            third_party/llvm-build/Release+Asserts
          key: ${{ runner.os }}-toolchain-${{ hashFiles('CLANG_REVISION') }}-v${{ env.CACHE_EPOCH }}
      - name: "Install dependency: prebuilt clang and clang-tidy binaries"
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          ./scripts/download-clang-prebuilt-binaries.py
          rm -f third_party/llvm-build/Release+Asserts/*.tgz
      - name: Change ubuntu mirror
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update -qq
      - name: Populate depedencies (test purposes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev:${{ matrix.arch }}
      - name: Set clang environment
        run: |
          echo "CC=${{ github.workspace }}/third_party/llvm-build/Release+Asserts/bin/clang" >> $GITHUB_ENV
          echo "CXX=${{ github.workspace }}/third_party/llvm-build/Release+Asserts/bin/clang++" >> $GITHUB_ENV
      - name: Build Unittests
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DBUILD_TESTS=on -DBUILD_BENCHMARKS=on -DGUI=on \
            -DUSE_ZLIB=on -DUSE_JSONCPP=on -DUSE_CARES=on \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.sanitizer.cmake_options }} ..
          ninja yass_test yass_benchmark
          cd ..
      - uses: actions/upload-artifact@v6
        with:
          name: s-linux-release-${{ matrix.build_type }}-${{ matrix.sanitizer.name }}-sanitizer-${{ matrix.arch }}-${{ github.run_id }}-test
          path: |
            build/yass_test
          compression-level: 9 # maximum compression
      - uses: actions/upload-artifact@v6
        with:
          name: s-linux-release-${{ matrix.build_type }}-${{ matrix.sanitizer.name }}-sanitizer-${{ matrix.arch }}-${{ github.run_id }}-benchmark
          path: |
            build/yass_benchmark
          compression-level: 9 # maximum compression
      - name: Memory layout fix for old clang
        run: |
          # TODO remove this once upstream fix is available
          # msan fix is here https://github.com/llvm/llvm-project/pull/85142
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run tests
        run: |
          cd build
          ./yass_test -logtostderr -v 1 --gtest_shuffle --gtest_repeat=100 --gtest_throw_on_failure
          cd ..
